# Marmara'nın Windows paketini derler, dener ve kurulum sihirbazı (Setup.exe) üretir.
#
#  1. build           LibreWolf'un Windows paketinden Marmara'yı derler (Linux'ta).
#  2. test            Windows makinesinde: simge ve ürün adını gömer, yeniden paketler, açılış dener.
#  3. installer       Linux'ta NSIS ile Marmara-Setup.exe üretir.
#  4. installer-test  Windows makinesinde: sessiz kurulum, kısayollar, açılış, kaldırma.
#
# İki şekilde kullanılır:
#  - librewolf-update.yml bunu her yeni sürümde çağırır (sürüm numarası ve adres verilir);
#  - elle çalıştırılabilir ("Windows denemesi"): release açmaz, sürüm numarasına dokunmaz;
#    sonuç dosyaları çalıştırma sayfasındaki "Artifacts" bölümünde durur.
#
# Çıktılar (artifact): marmara-windows-final (zip), marmara-windows-setup (Setup.exe).
# Bu dosya GitHub'da .github/workflows/ altında durmalı.

name: Windows denemesi

on:
  workflow_call:
    inputs:
      marmara-version:
        type: string
        default: ""
      windows-url:
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Adres ve sürüm
        id: ver
        env:
          GIVEN_URL: ${{ inputs.windows-url }}
          GIVEN_VERSION: ${{ inputs.marmara-version }}
        run: |
          url="$GIVEN_URL"
          if [ -z "$url" ]; then
            url="$(python3 scripts/latest-librewolf.py | sed -n 's/^windows_url=//p')"
          fi
          [ -n "$url" ] || { echo "LibreWolf Windows adresi bulunamadı" >&2; exit 1; }
          version="$GIVEN_VERSION"
          [ -n "$version" ] || version="$(tr -d '[:space:]' < VERSION)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Adres: $url"
          echo "Marmara sürümü: $version"

      - name: Gerekli araçlar
        run: |
          # Yansı sunucusu bazen takılıyor: her denemeye süre sınırı koy, 3 kez dene
          for i in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends python3 unzip zip gcc-mingw-w64-x86-64 \
              && break
            echo "apt denemesi $i başarısız, tekrar deneniyor"; sleep 5
            [ "$i" = 3 ] && exit 1
          done

      - name: LibreWolf Windows paketini indir
        run: curl -fL --retry 3 -o librewolf-win.zip "${{ steps.ver.outputs.url }}"

      - name: Sürüm numarasını ayarla
        run: scripts/bump-version.sh "${{ steps.ver.outputs.version }}"

      - name: Marmara'yı Windows için derle
        run: ./build.sh librewolf-win.zip --tarball --offline

      - name: Paketi sakla
        uses: actions/upload-artifact@v4
        with:
          name: marmara-windows
          path: dist/marmara-*-windows-x86_64.zip
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marmara-windows

      - name: Aç
        shell: pwsh
        run: |
          $zip = Get-ChildItem marmara-*-windows-x86_64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app

      - name: Simge ve ürün adını marmara-bin.exe'ye göm
        shell: pwsh
        run: |
          # LibreWolf'un exe'si kendi simgesini ve "LibreWolf" adını taşır; görev çubuğunda
          # görünen simge ve ad buradan gelir.
          $dir = (Resolve-Path app/marmara).Path
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          .\rcedit.exe "$dir\marmara-bin.exe" `
            --set-icon "$dir\marmara.ico" `
            --set-version-string FileDescription Marmara `
            --set-version-string ProductName Marmara `
            --set-version-string InternalName Marmara `
            --set-version-string CompanyName "Fuzuli Initiative" `
            --set-version-string OriginalFilename marmara-bin.exe
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::rcedit başarısız"; exit 1 }
          Remove-Item "$dir\marmara.ico"

      - name: Yeniden paketle
        shell: pwsh
        run: |
          $name = (Get-ChildItem marmara-*-windows-x86_64.zip | Select-Object -First 1).Name
          $full = Join-Path (Get-Location) $name
          Remove-Item $name
          # app klasörünün içinden paketle: zip'in kökü "marmara/" olsun
          Push-Location app
          7z a -tzip -mx=5 $full marmara | Out-Null
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { Write-Host "::error::7z başarısız"; exit 1 }

      - name: Başlat ve dene
        shell: pwsh
        run: |
          $dir = (Resolve-Path app/marmara).Path
          Get-ChildItem $dir | Select-Object -First 80 | Format-Table Name, Length | Out-String | Write-Host
          $profile_dir = Join-Path $env:RUNNER_TEMP "marmara-profile"
          New-Item -ItemType Directory -Force $profile_dir | Out-Null
          # Başlatıcıyı atlayıp doğrudan -app ile çalıştır: açılıyor mu, çöküyor mu?
          $p = Start-Process -FilePath "$dir\marmara-bin.exe" `
            -ArgumentList @("-app", "$dir\browser\application.ini", "--headless", "-no-remote", "-profile", $profile_dir) `
            -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "::error::Marmara başlangıçta kapandı (çıkış kodu $($p.ExitCode))"
            exit 1
          }
          Write-Host "Marmara 25 saniye sonra hâlâ çalışıyor."
          Get-ChildItem $profile_dir | Select-Object Name | Out-String | Write-Host
          if (-not (Test-Path "$profile_dir\prefs.js")) {
            Write-Host "::error::Profil oluşmadı (prefs.js yok)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force

      - name: Başlatıcı (marmara.exe) Marmara'yı açıyor mu?
        shell: pwsh
        run: |
          $dir = (Resolve-Path app/marmara).Path
          & "$dir\marmara.exe" --headless -no-remote -profile "$env:RUNNER_TEMP\marmara-profile2"
          Start-Sleep -Seconds 20
          $running = Get-Process marmara-bin -ErrorAction SilentlyContinue
          if (-not $running) {
            Write-Host "::error::marmara.exe, marmara-bin.exe'yi başlatamadı"
            exit 1
          }
          Write-Host "Başlatıcı çalışıyor."
          $running | Stop-Process -Force

      - name: Son paketi sakla
        uses: actions/upload-artifact@v4
        with:
          name: marmara-windows-final
          path: marmara-*-windows-x86_64.zip
          if-no-files-found: error

  installer:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: marmara-windows-final

      - name: Gerekli araçlar
        run: |
          # Yansı sunucusu bazen takılıyor: her denemeye süre sınırı koy, 3 kez dene
          for i in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends python3 unzip nsis \
              && break
            echo "apt denemesi $i başarısız, tekrar deneniyor"; sleep 5
            [ "$i" = 3 ] && exit 1
          done

      - name: Kurulum sihirbazını derle
        run: |
          unzip -q marmara-*-windows-x86_64.zip -d pkg
          # Paketin kök klasörü: marmara-bin.exe'nin bulunduğu yer
          appdir="$(dirname "$(find pkg -name marmara-bin.exe | head -n1)")"
          echo "Uygulama klasörü: $appdir"
          [ -f "$appdir/marmara-bin.exe" ] || { echo "marmara-bin.exe bulunamadı"; find pkg -maxdepth 3 | head -30; exit 1; }
          python3 -I scripts/make_ico.py installer.ico branding/icons/icon{16,32,48,64,128,256}.png
          makensis -V2 \
            -DVERSION="${{ needs.build.outputs.version }}" \
            -DAPPDIR="$PWD/$appdir" \
            -DICON="$PWD/installer.ico" \
            -DOUTFILE="$PWD/Marmara-Setup.exe" \
            packaging/windows/installer.nsi
          ls -l Marmara-Setup.exe

      - name: Kurulum sihirbazını sakla
        uses: actions/upload-artifact@v4
        with:
          name: marmara-windows-setup
          path: Marmara-Setup.exe
          if-no-files-found: error

  installer-test:
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marmara-windows-setup

      - name: Sessiz kurulum
        shell: pwsh
        run: |
          $p = Start-Process .\Marmara-Setup.exe -ArgumentList "/S" -Wait -PassThru
          Write-Host "Kurulum çıkış kodu: $($p.ExitCode)"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Marmara"
          foreach ($f in "marmara-bin.exe", "marmara.exe", "browser\application.ini", "omni.ja", "uninstall.exe") {
            if (-not (Test-Path "$dir\$f")) { Write-Host "::error::Kurulumda eksik: $f"; exit 1 }
          }
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Marmara Browser.lnk"
          if (-not (Test-Path $menu)) { Write-Host "::error::Başlat menüsü kısayolu yok"; exit 1 }
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "Marmara Browser.lnk"
          if (-not (Test-Path $desktop)) { Write-Host "::warning::Masaüstü kısayolu yok ($desktop)" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Marmara"
          if (-not (Test-Path $key)) { Write-Host "::error::Kaldırma kaydı yok"; exit 1 }
          foreach ($k in "HKCU:\Software\Clients\StartMenuInternet\Marmara\Capabilities", "HKCU:\Software\Classes\MarmaraURL\shell\open\command") {
            if (-not (Test-Path $k)) { Write-Host "::error::Tarayıcı kaydı yok: $k"; exit 1 }
          }
          Write-Host "Kısayol hedefi:"
          $sh = New-Object -ComObject WScript.Shell
          $lnk = $sh.CreateShortcut($menu)
          Write-Host "  $($lnk.TargetPath) $($lnk.Arguments)"

      - name: Kısayolun hedefiyle aç
        shell: pwsh
        run: |
          $sh = New-Object -ComObject WScript.Shell
          $lnk = $sh.CreateShortcut((Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Marmara Browser.lnk"))
          $profile_dir = Join-Path $env:RUNNER_TEMP "marmara-profile3"
          New-Item -ItemType Directory -Force $profile_dir | Out-Null
          $p = Start-Process -FilePath $lnk.TargetPath `
            -ArgumentList ($lnk.Arguments + " --headless -no-remote -profile `"$profile_dir`"") -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Host "::error::Kısayolla açılan Marmara kapandı ($($p.ExitCode))"; exit 1 }
          Write-Host "Kısayol çalışıyor."
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 3

      - name: Güncelleme denemesi (Marmara açıkken üzerine kur)
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Marmara"
          $profile_dir = Join-Path $env:RUNNER_TEMP "marmara-profile4"
          New-Item -ItemType Directory -Force $profile_dir | Out-Null
          $app = Start-Process -FilePath "$dir\marmara-bin.exe" `
            -ArgumentList "-app `"$dir\browser\application.ini`" --headless -no-remote -profile `"$profile_dir`"" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Write-Host "::error::Marmara açılmadı"; exit 1 }
          # Sihirbaz Marmara açıkken başlar ve kapanmasını bekler
          $setup = Start-Process .\Marmara-Setup.exe -ArgumentList "/S","/RELAUNCH" -PassThru
          Start-Sleep -Seconds 8
          if ($setup.HasExited) { Write-Host "::error::Sihirbaz Marmara kapanmadan bitti"; exit 1 }
          Stop-Process -Id $app.Id -Force
          if (-not $setup.WaitForExit(120000)) { Write-Host "::error::Sihirbaz bitmedi"; exit 1 }
          Write-Host "Sihirbaz çıkış kodu: $($setup.ExitCode)"
          if ($setup.ExitCode -ne 0) { exit 1 }
          Start-Sleep -Seconds 10
          $again = Get-Process marmara-bin -ErrorAction SilentlyContinue
          if (-not $again) { Write-Host "::error::Güncellemeden sonra Marmara yeniden açılmadı"; exit 1 }
          Write-Host "Güncelleme sonrası yeniden açıldı."
          $again | Stop-Process -Force

      - name: Kaldır
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Marmara"
          # _?= ile kaldırıcı kendini kopyalamadan, bitene kadar bekler
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait
          if (Test-Path "$dir\marmara-bin.exe") { Write-Host "::error::Kaldırma dosyaları silmedi"; exit 1 }
          if (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Marmara Browser.lnk")) { Write-Host "::error::Başlat menüsü kısayolu silinmedi"; exit 1 }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Marmara") { Write-Host "::error::Kaldırma kaydı silinmedi"; exit 1 }
          Write-Host "Kaldırma temiz."
