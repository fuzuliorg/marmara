<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Yeni Sekme</title>
  <link rel="icon" href="chrome://branding/content/icon32.png">
  <link rel="stylesheet" href="chrome://browser/content/marmara/startpage.css">
</head>
<body>
  <main>
    <header class="hero">
      <h1 id="clock">00:00</h1>
      <p id="greeting"></p>
    </header>

    <form id="search-form" class="search">
      <div class="engine">
        <button type="button" id="engine-btn" class="engine-btn" aria-haspopup="menu">
          <img id="engine-icon" alt="" width="16" height="16">
          <span id="engine-name"></span>
          <i class="ic ic-pan-down"></i>
        </button>
        <div id="engine-menu" class="menu" role="menu" hidden></div>
      </div>
      <input type="text" id="search-input" autocomplete="off" autofocus>
      <button type="submit" class="go" data-i18n-aria="search"><i class="ic ic-go-next"></i></button>
    </form>

    <section class="shortcuts" aria-labelledby="shortcuts-title">
      <h2 id="shortcuts-title" class="sr-only" data-i18n="shortcuts">Sık Kullanılanlar</h2>
      <div id="shortcut-grid" class="grid"></div>
    </section>
  </main>

  <dialog id="shortcut-dialog" class="dialog" aria-labelledby="sc-heading">
    <form id="shortcut-form" method="dialog" novalidate>
      <h2 id="sc-heading" data-i18n="newShortcut">Yeni Kısayol</h2>
      <label for="sc-title" data-i18n="titleLabel">Başlık</label>
      <input id="sc-title" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="titlePlaceholder">
      <label for="sc-url" data-i18n="urlLabel">Web adresi</label>
      <input id="sc-url" type="text" autocomplete="off" spellcheck="false" inputmode="url" data-i18n-placeholder="urlPlaceholder">
      <p id="sc-error" class="error" role="alert" hidden data-i18n="urlError"></p>
      <div class="buttons">
        <button type="button" id="sc-cancel" class="pill" data-i18n="cancel">İptal</button>
        <button type="submit" class="pill suggested" data-i18n="save">Kaydet</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="chrome://browser/content/marmara/startpage.js"></script>
</body>
</html>
